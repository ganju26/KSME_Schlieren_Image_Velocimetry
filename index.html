<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schlieren Image Velocimetry</title>
<style>
:root{--bg:#ffffff;--fg:#1b1b1b;--muted:#5a5a5a;--line:#dddddd;--card:#f6f6f6}
@media (prefers-color-scheme: dark){:root{--bg:#141414;--fg:#ececec;--muted:#a8a8a8;--line:#333333;--card:#1e1e1e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;line-height:1.55}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;margin:.2em 0 .3em}
.sub{color:var(--muted);font-size:.95rem;margin:0}
.tip{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.92rem;margin:14px 0 0}
figure{margin:28px 0 0}
.case{font-size:1.75rem;font-weight:800;margin:0 0 8px;letter-spacing:.01em}
.case span{font-weight:800}
video{display:block;width:100%;height:auto;background:#000;border-radius:6px}
h2{font-size:1.2rem;margin:2em 0 .5em;padding-bottom:.25em;border-bottom:1px solid var(--line)}
.method{font-size:.92rem;color:var(--muted)}
</style>
</head>
<body><main>

<h1>Schlieren Image Velocimetry</h1>

<figure>
<p class="case">Pure 130min</p>
<video src="videos/raw_vs_velocity_Pure_130min.mp4" poster="videos/raw_vs_velocity_Pure_130min.jpg" controls muted loop playsinline preload="metadata"></video>
</figure>
<figure>
<p class="case">EHD 6kV 130min</p>
<video src="videos/raw_vs_velocity_EHD6kV_130min.mp4" poster="videos/raw_vs_velocity_EHD6kV_130min.jpg" controls muted loop playsinline preload="metadata"></video>
</figure>
<figure>
<p class="case">Pure 200min</p>
<video src="videos/raw_vs_velocity_Pure_200min.mp4" poster="videos/raw_vs_velocity_Pure_200min.jpg" controls muted loop playsinline preload="metadata"></video>
</figure>
<figure>
<p class="case">EHD 6kV 200min</p>
<video src="videos/raw_vs_velocity_EHD6kV_200min.mp4" poster="videos/raw_vs_velocity_EHD6kV_200min.jpg" controls muted loop playsinline preload="metadata"></video>
</figure>

</main></body>
</html>
